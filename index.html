/* ============================================================
   Citrixa CashBook — Single-file app
   All CSS inline, no external dependencies
   ============================================================ */

:root {
  --primary: #0066CC;
  --primary-hover: #0052A3;
  --primary-fg: #ffffff;
  --primary-50: #E5EEF7;
  --primary-100: #CCE0F3;
  --primary-200: #99C2E6;
  --bg: #ffffff;
  --bg-soft: #f7f9fc;
  --bg-sidebar: #fbfcfe;
  --fg: #0f172a;
  --fg-muted: #64748b;
  --fg-soft: #94a3b8;
  --border: #e2e8f0;
  --border-soft: #eef2f7;
  --card: #ffffff;
  --muted: #f1f5f9;
  --accent: #f0f6fd;
  --income: #059669;
  --income-bg: #d1fae5;
  --expense: #e11d48;
  --expense-bg: #ffe4e6;
  --warn: #d97706;
  --warn-bg: #fef3c7;
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 14px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 10px 30px rgba(15, 23, 42, 0.12);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}

[data-theme="dark"] {
  --bg: #0f172a;
  --bg-soft: #131c31;
  --bg-sidebar: #131c31;
  --fg: #f1f5f9;
  --fg-muted: #94a3b8;
  --fg-soft: #64748b;
  --border: #1e293b;
  --border-soft: #1a2538;
  --card: #1a2538;
  --muted: #1e293b;
  --accent: #1e293b;
  --primary-50: #1e293b;
  --primary-100: #1e3a5f;
  --primary-200: #2c4f7c;
  --income-bg: #0f3528;
  --expense-bg: #3b0a1a;
  --warn-bg: #3b2c0a;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.45);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--fg);
  background: var(--bg);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
button { font-family: inherit; cursor: pointer; }
input, textarea, select, button { font-size: 14px; }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ===== Layout ===== */
.hidden { display: none !important; }
.flex { display: flex; }
.flex-1 { flex: 1; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-1 { gap: 4px; } .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; } .gap-6 { gap: 24px; }
.grid { display: grid; }
.text-xs { font-size: 11px; } .text-sm { font-size: 13px; } .text-md { font-size: 14px; } .text-lg { font-size: 18px; } .text-xl { font-size: 22px; } .text-2xl { font-size: 28px; }
.font-medium { font-weight: 500; } .font-semibold { font-weight: 600; } .font-bold { font-weight: 700; }
.muted { color: var(--fg-muted); } .soft { color: var(--fg-soft); }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabular { font-variant-numeric: tabular-nums; }
.text-center { text-align: center; } .text-right { text-align: right; }
.w-full { width: 100%; }
.rounded { border-radius: var(--radius); } .rounded-sm { border-radius: var(--radius-sm); } .rounded-lg { border-radius: var(--radius-lg); } .rounded-full { border-radius: 9999px; }
.shadow-sm { box-shadow: var(--shadow-sm); } .shadow { box-shadow: var(--shadow); } .shadow-md { box-shadow: var(--shadow-md); } .shadow-lg { box-shadow: var(--shadow-lg); }
.border { border: 1px solid var(--border); } .border-soft { border: 1px solid var(--border-soft); }
.bg-card { background: var(--card); } .bg-muted { background: var(--muted); } .bg-accent { background: var(--accent); } .bg-primary { background: var(--primary); color: var(--primary-fg); }
.p-1 { padding: 4px; } .p-2 { padding: 8px; } .p-3 { padding: 12px; } .p-4 { padding: 16px; } .p-5 { padding: 20px; } .p-6 { padding: 24px; }
.px-2 { padding-left: 8px; padding-right: 8px; } .px-3 { padding-left: 12px; padding-right: 12px; } .px-4 { padding-left: 16px; padding-right: 16px; } .px-5 { padding-left: 20px; padding-right: 20px; } .px-6 { padding-left: 24px; padding-right: 24px; }
.py-1 { padding-top: 4px; padding-bottom: 4px; } .py-2 { padding-top: 8px; padding-bottom: 8px; } .py-3 { padding-top: 12px; padding-bottom: 12px; } .py-4 { padding-top: 16px; padding-bottom: 16px; } .py-5 { padding-top: 20px; padding-bottom: 20px; }
.mb-1 { margin-bottom: 4px; } .mb-2 { margin-bottom: 8px; } .mb-3 { margin-bottom: 12px; } .mb-4 { margin-bottom: 16px; } .mb-6 { margin-bottom: 24px; }
.mt-1 { margin-top: 4px; } .mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; } .mt-4 { margin-top: 16px; } .mt-6 { margin-top: 24px; }
.gap-y-2 { row-gap: 8px; } .gap-x-3 { column-gap: 12px; }
.overflow-hidden { overflow: hidden; } .overflow-auto { overflow: auto; }
.relative { position: relative; } .absolute { position: absolute; } .sticky { position: sticky; }
.cursor-pointer { cursor: pointer; }
.divider { border-top: 1px solid var(--border-soft); }

/* ===== Buttons ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 36px;
  padding: 0 14px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: var(--primary);
  color: var(--primary-fg);
  font-weight: 600;
  font-size: 13px;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn:hover { background: var(--primary-hover); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-sm { height: 30px; padding: 0 10px; font-size: 12px; }
.btn-lg { height: 44px; padding: 0 20px; font-size: 14px; }
.btn-outline {
  background: transparent;
  color: var(--primary);
  border-color: var(--primary);
}
.btn-outline:hover { background: var(--primary-50); }
.btn-ghost {
  background: transparent;
  color: var(--fg);
  border-color: transparent;
}
.btn-ghost:hover { background: var(--muted); }
.btn-soft { background: var(--muted); color: var(--fg); border-color: var(--border); }
.btn-soft:hover { background: var(--accent); }
.btn-danger { background: var(--expense); color: white; }
.btn-icon { width: 36px; padding: 0; }
.btn-icon.btn-sm { width: 30px; }

/* ===== Inputs ===== */
.input, .textarea, .select-trigger {
  display: block;
  width: 100%;
  height: 36px;
  padding: 0 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--fg);
  font-size: 14px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.textarea { height: auto; padding: 8px 12px; resize: vertical; min-height: 60px; line-height: 1.5; }
.input:focus, .textarea:focus, .select-trigger:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.15);
}
.label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }

/* ===== Cards ===== */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.card-body { padding: 16px; }
.card-body-tight { padding: 12px 16px; }
.card-header { padding: 12px 16px; border-bottom: 1px solid var(--border-soft); }

/* ===== Badges ===== */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 9999px;
  font-size: 11px;
  font-weight: 600;
  background: var(--muted);
  color: var(--fg-muted);
}
.badge-primary { background: var(--primary-50); color: var(--primary); }
.badge-success { background: var(--income-bg); color: var(--income); }
.badge-danger { background: var(--expense-bg); color: var(--expense); }
.badge-warn { background: var(--warn-bg); color: var(--warn); }

/* ===== Avatars ===== */
.avatar {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 9999px;
  color: white;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
}
.avatar-sm { width: 24px; height: 24px; font-size: 9px; }
.avatar-lg { width: 48px; height: 48px; font-size: 16px; }

/* ===== Login screen ===== */
.login-wrap { display: flex; min-height: 100vh; }
.login-left {
  display: none;
  width: 42%;
  background: var(--primary-50);
  padding: 32px 40px;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}
@media (min-width: 1024px) { .login-left { display: flex; } }
.login-right { flex: 1; display: flex; flex-direction: column; }

.brand-logo { display: inline-flex; align-items: center; gap: 8px; }
.brand-logo img { height: 30px; width: auto; }

.carousel-slide { animation: fadeIn 0.5s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.dot { width: 10px; height: 10px; border-radius: 9999px; background: rgba(0, 102, 204, 0.25); border: none; cursor: pointer; transition: all 0.2s; padding: 0; }
.dot.active { width: 28px; background: var(--primary); }
.carousel-arrow { width: 36px; height: 36px; border-radius: 9999px; border: 1px solid rgba(0, 102, 204, 0.4); background: transparent; color: var(--primary); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; }
.carousel-arrow:hover { background: var(--primary); color: white; }

.social-btn {
  width: 100%;
  height: 44px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--fg);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  font-weight: 500;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.15s;
}
.social-btn:hover { background: var(--muted); }

.install-banner {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #0f172a;
  color: white;
  border-radius: var(--radius);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow-lg);
  z-index: 50;
  max-width: 90%;
}

/* ===== App shell ===== */
.app-shell { display: flex; min-height: 100vh; background: var(--bg); }
.sidebar {
  width: 260px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: hidden;
}
@media (max-width: 1023px) {
  .sidebar { position: fixed; left: -280px; z-index: 40; transition: left 0.25s; }
  .sidebar.open { left: 0; }
}
.sidebar-overlay {
  position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); z-index: 35;
  display: none;
}
.sidebar-overlay.show { display: block; }
@media (min-width: 1024px) { .sidebar-overlay { display: none !important; } }

.nav-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  height: 40px;
  padding: 0 12px;
  border-radius: var(--radius-sm);
  background: transparent;
  border: none;
  color: var(--fg);
  font-size: 13px;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
  transition: background 0.15s;
}
.nav-item:hover { background: var(--accent); }
.nav-item.active { background: var(--primary-50); color: var(--primary); }
.nav-item .nav-icon { width: 18px; height: 18px; flex-shrink: 0; }
.nav-count { margin-left: auto; font-size: 11px; padding: 2px 8px; background: var(--muted); border-radius: 9999px; color: var(--fg-muted); }
.nav-item.active .nav-count { background: var(--primary-100); color: var(--primary); }

.sidebar-section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--fg-soft); padding: 0 12px; margin: 16px 0 8px; display: flex; align-items: center; justify-content: space-between; }

.main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.header {
  position: sticky;
  top: 0;
  z-index: 30;
  height: 64px;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border-soft);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
}
[data-theme="dark"] .header { background: rgba(26, 37, 56, 0.95); }

.biz-switcher {
  display: flex; align-items: center; gap: 8px;
  padding: 0 8px; height: 36px; border-radius: var(--radius-sm);
  background: transparent; border: none; cursor: pointer; max-width: 280px;
}
.biz-switcher:hover { background: var(--accent); }
.biz-avatar { width: 28px; height: 28px; border-radius: var(--radius-sm); color: white; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

.search-wrap { position: relative; flex: 1; max-width: 420px; }
.search-wrap .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--fg-soft); pointer-events: none; }
.search-input { padding-left: 36px; background: var(--muted); border-color: transparent; }
.search-input:focus { background: var(--bg); border-color: var(--primary); }

.icon-btn {
  width: 36px; height: 36px; border-radius: var(--radius-sm); border: none;
  background: transparent; color: var(--fg); display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background 0.15s; position: relative;
}
.icon-btn:hover { background: var(--accent); }

.user-pill {
  display: flex; align-items: center; gap: 8px; padding: 0 8px; height: 36px; border-radius: var(--radius-sm);
  background: transparent; border: none; cursor: pointer;
}
.user-pill:hover { background: var(--accent); }

.content { padding: 20px 24px; max-width: 1280px; margin: 0 auto; width: 100%; }
@media (max-width: 640px) { .content { padding: 16px; } }

/* ===== Dropdown ===== */
.dropdown { position: absolute; top: calc(100% + 4px); right: 0; min-width: 220px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-md); padding: 6px; z-index: 50; }
.dropdown-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--radius-sm); background: transparent; border: none; color: var(--fg); font-size: 13px; cursor: pointer; width: 100%; text-align: left; }
.dropdown-item:hover { background: var(--accent); }
.dropdown-item.danger { color: var(--expense); }
.dropdown-item.danger:hover { background: var(--expense-bg); }
.dropdown-divider { height: 1px; background: var(--border-soft); margin: 6px 0; }
.dropdown-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--fg-soft); padding: 6px 10px; }
.dropdown-wrap { position: relative; }

/* ===== Summary cards ===== */
.summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 768px) { .summary-grid { grid-template-columns: 1fr; } }
.summary-card { padding: 16px 20px; }
.summary-label { font-size: 13px; font-weight: 500; color: var(--fg-muted); }
.summary-icon { width: 32px; height: 32px; border-radius: var(--radius-sm); display: inline-flex; align-items: center; justify-content: center; }
.summary-icon.income { background: var(--income-bg); color: var(--income); }
.summary-icon.expense { background: var(--expense-bg); color: var(--expense); }
.summary-value { font-size: 26px; font-weight: 700; margin-top: 8px; font-variant-numeric: tabular-nums; }
.summary-delta { font-size: 12px; color: var(--fg-muted); margin-top: 4px; }

/* ===== Toolbar ===== */
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.select-trigger { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; }
.select-trigger:hover { background: var(--accent); }

/* ===== Entries list ===== */
.day-header { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; margin-bottom: 8px; }
.day-totals { font-size: 12px; font-weight: 600; }
.day-totals .in { color: var(--income); } .day-totals .out { color: var(--expense); }

.entry-row {
  display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border-soft); transition: background 0.15s;
}
.entry-row:last-child { border-bottom: none; }
.entry-row:hover { background: var(--accent); }
.entry-icon { width: 40px; height: 40px; border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.entry-icon.in { background: var(--income-bg); }
.entry-icon.out { background: var(--expense-bg); }
.entry-note { font-weight: 500; font-size: 13px; }
.entry-meta { font-size: 11px; color: var(--fg-muted); margin-top: 2px; display: flex; gap: 6px; flex-wrap: wrap; }
.entry-amount { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.entry-amount.in { color: var(--income); }
.entry-amount.out { color: var(--expense); }
.entry-actions { opacity: 0; transition: opacity 0.15s; }
.entry-row:hover .entry-actions { opacity: 1; }

/* ===== Modal ===== */
.modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 16px; }
.modal { background: var(--card); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; }
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border-soft); display: flex; align-items: center; justify-content: space-between; }
.modal-body { padding: 20px; }
.modal-footer { padding: 16px 20px; border-top: 1px solid var(--border-soft); display: flex; gap: 8px; justify-content: flex-end; }

.type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--muted); border-radius: var(--radius-sm); }
.type-toggle button { height: 40px; border-radius: var(--radius-sm); border: none; background: transparent; font-weight: 600; font-size: 14px; color: var(--fg-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.15s; }
.type-toggle button.active.income { background: var(--income); color: white; }
.type-toggle button.active.expense { background: var(--expense); color: white; }

.amount-input-wrap { position: relative; }
.amount-input-wrap::before { content: "AED"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--fg-muted); font-weight: 500; }
.amount-input { padding-left: 48px; height: 48px; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }

.upload-area { height: 48px; border: 2px dashed var(--border); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; color: var(--fg-muted); font-size: 13px; transition: all 0.15s; }
.upload-area:hover { border-color: var(--primary); background: var(--accent); }

/* ===== Toast ===== */
.toast-wrap { position: fixed; bottom: 24px; right: 24px; z-index: 80; display: flex; flex-direction: column; gap: 8px; max-width: 360px; }
.toast {
  background: var(--fg); color: var(--bg); padding: 12px 16px; border-radius: var(--radius); box-shadow: var(--shadow-lg);
  display: flex; align-items: flex-start; gap: 10px; animation: slideIn 0.25s ease-out; min-width: 240px;
}
.toast.success { border-left: 4px solid var(--income); }
.toast.error { border-left: 4px solid var(--expense); }
.toast.info { border-left: 4px solid var(--primary); }
@keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
.toast-title { font-weight: 600; font-size: 13px; }
.toast-desc { font-size: 12px; opacity: 0.85; margin-top: 2px; }

/* ===== Charts ===== */
.chart-area { width: 100%; height: 300px; }
.chart-pie { width: 100%; height: 260px; }

/* ===== Tables ===== */
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th, .table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border-soft); }
.table th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--fg-soft); font-weight: 600; }

/* ===== Settings ===== */
.setting-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; }
.switch { width: 36px; height: 20px; background: var(--muted); border-radius: 9999px; position: relative; cursor: pointer; transition: background 0.2s; border: none; padding: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: white; border-radius: 9999px; transition: left 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
.switch.on { background: var(--primary); }
.switch.on::after { left: 18px; }

/* ===== Mobile responsive helpers ===== */
.hide-mobile { display: none; }
@media (min-width: 768px) { .hide-mobile { display: flex; } .hide-mobile.inline { display: inline-flex; } }
.hide-desktop { display: flex; }
@media (min-width: 1024px) { .hide-desktop { display: none; } }

/* Mobile header menu button */
.menu-toggle { display: inline-flex; }
@media (min-width: 1024px) { .menu-toggle { display: none; } }

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--fg-soft); }

/* Footer sticky save */
.save-bar { position: sticky; bottom: 16px; display: flex; justify-content: flex-end; }

/* Permission matrix */
.perm-cell { text-align: center; padding: 8px; }
.perm-cell.ok { color: var(--income); font-weight: 700; }
.perm-cell.no { color: var(--fg-soft); }

/* Progress bar */
.progress-bar { height: 8px; background: var(--muted); border-radius: 9999px; overflow: hidden; }
.progress-bar > div { height: 100%; border-radius: 9999px; }

/* Stats grid */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 768px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
.stats-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 768px) { .stats-grid-3 { grid-template-columns: 1fr; } }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
</style>
</head>

    <!-- Minimal login form — just 2 inputs + a button -->
    <form id="minimalLoginForm" onsubmit="handleMinimalLogin(event)" style="background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding: 24px; display: flex; flex-direction: column; gap: 16px;">
      <!-- Email or Phone -->
      <div>
        <label for="loginIdentifier" style="display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--fg);">Email or Phone</label>
        <div style="position: relative;">
          <span id="loginIdentifierIcon" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--fg-muted); pointer-events: none; display: inline-flex; align-items: center;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </span>
          <input id="loginIdentifier" type="text" autocomplete="username" placeholder="demo" oninput="updateIdentifierIcon(this.value)" style="display: block; width: 100%; height: 44px; padding: 0 12px 0 40px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--fg); font-size: 14px; box-sizing: border-box;" autofocus />
        </div>
      </div>

      <!-- Password -->
      <div>
        <label for="loginPassword" style="display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--fg);">Password</label>
        <div style="position: relative;">
          <span style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--fg-muted); pointer-events: none; display: inline-flex; align-items: center;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="demo" style="display: block; width: 100%; height: 44px; padding: 0 40px 0 40px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--fg); font-size: 14px; box-sizing: border-box;" />
          <button type="button" onclick="togglePasswordVisibility()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: var(--fg-muted); cursor: pointer; padding: 4px; display: inline-flex; align-items: center;" aria-label="Toggle password visibility" tabindex="-1">
            <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <!-- Enter button — full width -->
      <button type="submit" id="loginEnterBtn" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 44px; padding: 0 20px; border-radius: var(--radius-sm); border: none; background: var(--primary); color: var(--primary-fg); font-weight: 600; font-size: 14px; cursor: pointer; transition: background 0.15s;" onmouseover="this.style.background='var(--primary-hover)'" onmouseout="this.style.background='var(--primary)'">
        <span id="loginBtnLabel">Enter</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>

      <!-- Divider -->
      <div style="display: flex; align-items: center; gap: 12px; padding: 4px 0;">
        <div style="flex: 1; height: 1px; background: var(--border);"></div>
        <span style="font-size: 11px; color: var(--fg-muted);">or</span>
        <div style="flex: 1; height: 1px; background: var(--border);"></div>
      </div>

      <!-- Download App button — plain link (native browser download) -->
      <a href="Citrixa-CashBook.apk" download="Citrixa-CashBook.apk" target="_blank" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 44px; padding: 0 20px; border-radius: var(--radius-sm); border: 1px solid var(--primary); background: transparent; color: var(--primary); font-weight: 600; font-size: 14px; cursor: pointer; transition: background 0.15s; text-decoration: none;" onmouseover="this.style.background='var(--primary-50)'" onmouseout="this.style.background='transparent'" onclick="handleInstallApp()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
        Download App
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </a>
    </form>
  </div>
</div>

/* ---------- Helpers ---------- */
function $(id) { return document.getElementById(id); }
function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "style" && typeof v === "object") Object.assign(e.style, v);
    else if (v !== undefined && v !== null) e.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null) continue;
    if (typeof c === "string" || typeof c === "number") e.appendChild(document.createTextNode(String(c)));
    else e.appendChild(c);
  }
  return e;
}
function formatINR(amount) {
  const neg = amount < 0;
  const abs = Math.abs(Math.round(amount * 100) / 100);
  const str = abs.toLocaleString("en-AE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (neg ? "−" : "") + "AED " + str;
}
function formatINRShort(amount) {
  const abs = Math.abs(amount);
  const sign = amount < 0 ? "−" : "";
  if (abs >= 1000000) return sign + "AED " + (abs / 1000000).toFixed(2) + "M";
  if (abs >= 1000) return sign + "AED " + (abs / 1000).toFixed(1) + "K";
  return formatINR(amount);
}
function formatDate(iso) {
  return new Date(iso).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
}
function formatDayLabel(dateKey) {
  const d = new Date(dateKey + "T00:00:00");
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
  const same = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  if (same(d, today)) return "Today";
  if (same(d, yesterday)) return "Yesterday";
  return d.toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short", year: now.getFullYear() === d.getFullYear() ? undefined : "numeric" });
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ---------- Toast ---------- */
function toast(message, type = "success", description = "") {
  const wrap = $("toastWrap");
  const t = el("div", { class: "toast " + type });
  const icons = {
    success: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
    error: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
    info: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
  };
  t.innerHTML = `<div style="flex-shrink: 0; color: ${type === 'success' ? 'var(--income)' : type === 'error' ? 'var(--expense)' : 'var(--primary)'}">${icons[type] || icons.info}</div><div style="flex: 1;"><div class="toast-title">${escapeHtml(message)}</div>${description ? `<div class="toast-desc">${escapeHtml(description)}</div>` : ""}</div>`;
  wrap.appendChild(t);
  setTimeout(() => { t.style.opacity = "0"; t.style.transform = "translateX(20px)"; t.style.transition = "all 0.25s"; }, 3000);
  setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 3300);
}

/* ---------- Filters ---------- */
function onSearch(v) { state.search = v; renderView(); }
function setFilterType(t) { state.filterType = t; renderView(); }
function setDateRange(p) { state.dateRangePreset = p; renderView(); }

function getFilteredEntries() {
  const now = new Date();
  let rangeMs = 0;
  if (state.dateRangePreset === "today") rangeMs = 86400000;
  else if (state.dateRangePreset === "7d") rangeMs = 7 * 86400000;
  else if (state.dateRangePreset === "30d") rangeMs = 30 * 86400000;
  else if (state.dateRangePreset === "90d") rangeMs = 90 * 86400000;
  const q = state.search.trim().toLowerCase();
  return state.entries.filter(e => {
    if (e.businessId !== state.activeBusinessId) return false;
    if (state.activeCashbookId && e.cashbookId !== state.activeCashbookId) return false;
    if (state.filterType !== "all" && e.type !== state.filterType) return false;
    if (rangeMs > 0 && now.getTime() - new Date(e.date).getTime() > rangeMs) return false;
    if (q) {
      const party = state.parties.find(p => p.id === e.partyId);
      const cat = categories.find(c => c.id === e.categoryId);
      const hay = (e.note + " " + (party?.name || "") + " " + (cat?.name || "")).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function saveEntry() {
  const amt = parseFloat(entryForm.amount);
  if (!amt || amt <= 0) { toast("Enter a valid amount", "error"); return; }
  if (!entryForm.categoryId) { toast("Pick a category", "error"); return; }
  if (!entryForm.cashbookId) { toast("Pick a cashbook", "error"); return; }
  const editingId = entryForm.editingId;
  if (editingId) {
    // Edit mode: patch existing entry
    const idx = state.entries.findIndex(e => e.id === editingId);
    if (idx >= 0) {
      state.entries[idx] = {
        ...state.entries[idx],
        cashbookId: entryForm.cashbookId,
        partyId: entryForm.partyId || undefined,
        categoryId: entryForm.categoryId,
        type: entryForm.type,
        amount: parseFloat(entryForm.amount),
        note: entryForm.note.trim() || (entryForm.type === "in" ? "Cash In" : "Cash Out"),
        date: new Date(entryForm.date).toISOString(),
        attachmentName: entryForm.attachmentName,
      };
      state.entries.sort((a, b) => new Date(b.date) - new Date(a.date));
      closeModal();
      renderSidebar(); renderView();
      toast("Entry updated");
    }
    return;
  }
  const id = "e" + (state.entries.length + 1) + Math.random().toString(36).slice(2, 6);
  // Combine chosen date with current time so it sorts properly within the day
  const now = new Date();
  const dateObj = new Date(entryForm.date + "T00:00:00");
  dateObj.setHours(now.getHours(), now.getMinutes(), now.getSeconds(), 0);
  const newEntry = {
    id, businessId: state.activeBusinessId, cashbookId: entryForm.cashbookId,
    partyId: entryForm.partyId || undefined, categoryId: entryForm.categoryId,
    type: entryForm.type, amount: amt,
    note: entryForm.note.trim() || (entryForm.type === "in" ? "Cash In" : "Cash Out"),
    date: dateObj.toISOString(), createdAt: new Date().toISOString(),
    createdBy: state.user.id, attachmentName: entryForm.attachmentName,
  };
  state.entries.unshift(newEntry);
  state.entries.sort((a, b) => new Date(b.date) - new Date(a.date));
  // Update party balance
  if (newEntry.partyId) {
    state.parties = state.parties.map(p => p.id !== newEntry.partyId ? p : { ...p, balance: p.balance + (newEntry.type === "in" ? -newEntry.amount : newEntry.amount) });
  }
  closeModal();
  renderSidebar();
  renderView();
  toast(`Entry added: ${entryForm.type === "in" ? "+" : "−"}₹${amt.toLocaleString("en-IN")}`);
}

/* ---------- SVG Charts ---------- */
function drawCharts() {
  const filtered = getFilteredEntries();
  // Build daily series
  const days = state.dateRangePreset === "today" ? 1 : state.dateRangePreset === "7d" ? 7 : state.dateRangePreset === "30d" ? 30 : state.dateRangePreset === "90d" ? 90 : 60;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const series = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0, 10);
    const items = filtered.filter(e => e.date.slice(0, 10) === key);
    const inSum = items.filter(e => e.type === "in").reduce((s, e) => s + e.amount, 0);
    const outSum = items.filter(e => e.type === "out").reduce((s, e) => s + e.amount, 0);
    series.push({ date: key, in: inSum, out: outSum, label: d.toLocaleDateString("en-IN", { day: "numeric", month: "short" }) });
  }
  drawAreaChart("trendChart", series);
  // Expense by category
  const expMap = new Map();
  filtered.filter(e => e.type === "out").forEach(e => expMap.set(e.categoryId, (expMap.get(e.categoryId) || 0) + e.amount));
  const expByCat = Array.from(expMap.entries()).map(([id, val]) => ({ name: categories.find(c => c.id === id)?.name || "Other", value: val, color: categories.find(c => c.id === id)?.color || "#888" })).sort((a, b) => b.value - a.value);
  drawDonut("expensePie", expByCat);
  // Income by category
  const incMap = new Map();
  filtered.filter(e => e.type === "in").forEach(e => incMap.set(e.categoryId, (incMap.get(e.categoryId) || 0) + e.amount));
  const incByCat = Array.from(incMap.entries()).map(([id, val]) => ({ name: categories.find(c => c.id === id)?.name || "Other", value: val, color: categories.find(c => c.id === id)?.color || "#888" })).sort((a, b) => b.value - a.value);
  drawBarChart("incomeBar", incByCat);
  // Category breakdown bars
  const total = expByCat.reduce((s, c) => s + c.value, 0);

function drawAreaChart(containerId, series) {
  const wrap = $(containerId);
  if (!wrap) return;
  const w = wrap.clientWidth || 800, h = 300;
  const pad = { top: 10, right: 16, bottom: 24, left: 50 };
  const innerW = w - pad.left - pad.right, innerH = h - pad.top - pad.bottom;
  const maxVal = Math.max(1, ...series.map(s => Math.max(s.in, s.out)));
  const xStep = series.length > 1 ? innerW / (series.length - 1) : 0;
  const yScale = v => pad.top + innerH - (v / maxVal) * innerH;
  const points = (key) => series.map((s, i) => `${pad.left + i * xStep},${yScale(s[key])}`).join(" ");
  const areaPath = (key) => `M ${pad.left},${pad.top + innerH} L ${points(key).split(" ").join(" L ")} L ${pad.left + (series.length - 1) * xStep},${pad.top + innerH} Z`;
  // Y axis ticks
  const ticks = 4;
  let gridLines = "";
  for (let i = 0; i <= ticks; i++) {
    const v = (maxVal / ticks) * (ticks - i);
    const y = pad.top + (innerH / ticks) * i;
    gridLines += `<line x1="${pad.left}" y1="${y}" x2="${pad.left + innerW}" y2="${y}" stroke="var(--border-soft)" stroke-width="1" stroke-dasharray="3 3"/><text x="${pad.left - 6}" y="${y + 3}" text-anchor="end" font-size="10" fill="var(--fg-soft)">${formatINRShort(v)}</text>`;
  }
  // X labels (every Nth)
  const labelStep = Math.max(1, Math.floor(series.length / 7));
  let xLabels = "";
  series.forEach((s, i) => {
    if (i % labelStep === 0 || i === series.length - 1) {
      const x = pad.left + i * xStep;
      xLabels += `<text x="${x}" y="${h - 6}" text-anchor="middle" font-size="10" fill="var(--fg-soft)">${s.label}</text>`;
    }
  });
  wrap.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width: 100%; height: 100%;">
    <defs>
      <linearGradient id="areaIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/><stop offset="100%" stop-color="#10B981" stop-opacity="0"/></linearGradient>
      <linearGradient id="areaOut" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#EF4444" stop-opacity="0.35"/><stop offset="100%" stop-color="#EF4444" stop-opacity="0"/></linearGradient>
    </defs>
    ${gridLines}
    ${xLabels}
    <path d="${areaPath("in")}" fill="url(#areaIn)"/>
    <polyline points="${points("in")}" fill="none" stroke="#10B981" stroke-width="2"/>
    <path d="${areaPath("out")}" fill="url(#areaOut)"/>
    <polyline points="${points("out")}" fill="none" stroke="#EF4444" stroke-width="2"/>
    <g transform="translate(${pad.left}, ${pad.top + 4})">
      <circle cx="0" cy="0" r="5" fill="#10B981"/><text x="10" y="3" font-size="11" fill="var(--fg-muted)" font-weight="600">Cash In</text>
      <circle cx="70" cy="0" r="5" fill="#EF4444"/><text x="80" y="3" font-size="11" fill="var(--fg-muted)" font-weight="600">Cash Out</text>
    </g>
  </svg>`;
}
function drawDonut(containerId, data) {
  const wrap = $(containerId);
  if (!wrap) return;
  const total = data.reduce((s, d) => s + d.value, 0);
  const w = wrap.clientWidth || 400, h = 260;
  const cx = w * 0.35, cy = h / 2, r = Math.min(w * 0.35, h / 2) - 10, ir = r * 0.55;
  let angle = -Math.PI / 2;
  let paths = "";
  data.forEach(d => {
    const frac = total > 0 ? d.value / total : 0;
    const a2 = angle + frac * Math.PI * 2;
    const x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
    const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
    const x3 = cx + ir * Math.cos(a2), y3 = cy + ir * Math.sin(a2);
    const x4 = cx + ir * Math.cos(angle), y4 = cy + ir * Math.sin(angle);
    const large = frac > 0.5 ? 1 : 0;
    paths += `<path d="M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} L ${x3} ${y3} A ${ir} ${ir} 0 ${large} 0 ${x4} ${y4} Z" fill="${d.color}"><title>${escapeHtml(d.name)}: ${formatINR(d.value)}</title></path>`;
    angle = a2;
  });
  let legend = "";
  data.forEach((d, i) => {
    const y = 20 + i * 22;
    legend += `<g transform="translate(${w * 0.7}, ${y})"><rect width="10" height="10" fill="${d.color}"/><text x="16" y="9" font-size="11" fill="var(--fg-muted)">${escapeHtml(d.name)}</text></g>`;
  });
  wrap.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width: 100%; height: 100%;">
    ${paths}
    <text x="${cx}" y="${cy}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--fg)">${formatINRShort(total)}</text>
    <text x="${cx}" y="${cy + 14}" text-anchor="middle" font-size="10" fill="var(--fg-muted)">Total</text>
    ${legend}
  </svg>`;
}
function drawBarChart(containerId, data) {
  const wrap = $(containerId);
  if (!wrap) return;
  const w = wrap.clientWidth || 400, h = 260;
  const pad = { top: 10, right: 16, bottom: 5, left: 100 };
  const innerW = w - pad.left - pad.right, innerH = h - pad.top - pad.bottom;
  const maxVal = Math.max(1, ...data.map(d => d.value));
  const barH = data.length > 0 ? Math.min(28, innerH / data.length - 4) : 20;
  const gap = data.length > 0 ? Math.max(4, (innerH / data.length - barH)) : 4;
  let bars = "";
  data.forEach((d, i) => {
    const y = pad.top + i * (barH + gap);
    const bw = (d.value / maxVal) * innerW;
    bars += `<text x="${pad.left - 6}" y="${y + barH / 2 + 3}" text-anchor="end" font-size="11" fill="var(--fg-muted)">${escapeHtml(d.name)}</text>`;
    bars += `<rect x="${pad.left}" y="${y}" width="${bw}" height="${barH}" fill="${d.color}" rx="4"><title>${escapeHtml(d.name)}: ${formatINR(d.value)}</title></rect>`;
    bars += `<text x="${pad.left + bw + 6}" y="${y + barH / 2 + 3}" font-size="11" fill="var(--fg-muted)">${formatINRShort(d.value)}</text>`;
  });
  wrap.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width: 100%; height: 100%;">${bars}</svg>`;
}

/* ---------- Active button handlers ---------- */
function downloadCSV(filename, rows) {
  const escape = (v) => {
    const s = String(v);
    if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  };
  const csv = rows.map(r => r.map(escape).join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.style.display = "none";
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}
function todayStamp() { return new Date().toISOString().slice(0, 10); }

function editEntry(id) {
  const e = state.entries.find(x => x.id === id);
  if (!e) return;
  entryForm = {
    type: e.type,
    amount: String(e.amount),
    note: e.note,
    categoryId: e.categoryId,
    partyId: e.partyId || "",
    cashbookId: e.cashbookId,
    date: e.date.slice(0, 10),
    attachmentName: e.attachmentName,
    editingId: id,
  };
  renderAddEntryModal();
}
function duplicateEntry(id) {
  const e = state.entries.find(x => x.id === id);
  if (!e) return;
  const now = new Date();
  const dateObj = new Date(e.date.slice(0, 10) + "T00:00:00");
  dateObj.setHours(now.getHours(), now.getMinutes(), now.getSeconds(), 0);
  const newId = "e" + (state.entries.length + 1) + Math.random().toString(36).slice(2, 6);
  state.entries.unshift({
    id: newId,
    businessId: e.businessId,
    cashbookId: e.cashbookId,
    partyId: e.partyId,
    categoryId: e.categoryId,
    type: e.type,
    amount: e.amount,
    note: e.note + " (copy)",
    date: dateObj.toISOString(),
    createdAt: new Date().toISOString(),
    createdBy: state.user.id,
    attachmentName: e.attachmentName,
  });
  state.entries.sort((a, b) => new Date(b.date) - new Date(a.date));
  if (newEntry.partyId) {
    state.parties = state.parties.map(p => p.id !== newEntry.partyId ? p : { ...p, balance: p.balance + (newEntry.type === "in" ? -newEntry.amount : newEntry.amount) });
  }
  renderSidebar(); renderView();
  toast("Entry duplicated");
}
function exportEntriesCSV() {
  const filtered = getFilteredEntries();
  const biz = businesses.find(b => b.id === state.activeBusinessId);
  const bizName = (biz?.name || "business").replace(/\s+/g, "-");
  const rows = [
    ["Date", "Type", "Amount (AED)", "Category", "Party", "Cashbook", "Note", "Attachment", "Created By"],
    ...filtered.map(e => [
      new Date(e.date).toLocaleString("en-AE"),
      e.type === "in" ? "Cash In" : "Cash Out",
      e.amount,
      categories.find(c => c.id === e.categoryId)?.name || "",
      e.partyId ? (state.parties.find(p => p.id === e.partyId)?.name || "") : "",
      cashbooks.find(c => c.id === e.cashbookId)?.name || "",
      e.note,
      e.attachmentName || "",
      teamUsers.find(u => u.id === e.createdBy)?.name || "",
    ])
  ];
  downloadCSV(`Citrixa-${bizName}-entries-${todayStamp()}.csv`, rows);
  toast("Exported " + filtered.length + " entries to CSV");
}
function exportReportsCSV() {
  const filtered = getFilteredEntries();
  let cashIn = 0, cashOut = 0;
  filtered.forEach(e => { if (e.type === "in") cashIn += e.amount; else cashOut += e.amount; });
  const netSavings = cashIn - cashOut;
  const savingsRate = cashIn > 0 ? (netSavings / cashIn * 100) : 0;
  const expMap = new Map();
  filtered.filter(e => e.type === "out").forEach(e => expMap.set(e.categoryId, (expMap.get(e.categoryId) || 0) + e.amount));
  const expByCat = Array.from(expMap.entries()).map(([id, val]) => ({ name: categories.find(c => c.id === id)?.name || "Other", value: val })).sort((a, b) => b.value - a.value);
  const incMap = new Map();
  filtered.filter(e => e.type === "in").forEach(e => incMap.set(e.categoryId, (incMap.get(e.categoryId) || 0) + e.amount));
  const incByCat = Array.from(incMap.entries()).map(([id, val]) => ({ name: categories.find(c => c.id === id)?.name || "Other", value: val })).sort((a, b) => b.value - a.value);
  const rows = [
    ["Metric", "Value"],
    ["Cash In (AED)", cashIn],
    ["Cash Out (AED)", cashOut],
    ["Net Savings (AED)", netSavings],
    ["Savings Rate (%)", savingsRate.toFixed(2)],
    ["Total Entries", filtered.length],
    [],
    ["Category", "Type", "Amount (AED)", "% of total"],
    ...expByCat.map(c => [c.name, "Expense", c.value, cashOut > 0 ? (c.value / cashOut * 100).toFixed(1) : "0"]),
    ...incByCat.map(c => [c.name, "Income", c.value, cashIn > 0 ? (c.value / cashIn * 100).toFixed(1) : "0"]),
  ];
  downloadCSV(`Citrixa-report-${todayStamp()}.csv`, rows);
  toast("Report exported as CSV");
}
function exportReportsPDF() {
  // Browser print → user can save as PDF
  window.print();
}
function addNewBusiness() {
  const name = prompt("Business name?");
  if (!name || !name.trim()) return;
  const type = prompt("Business type (e.g. Retail, Restaurant)?", "General") || "General";
  const id = "biz" + Math.random().toString(36).slice(2, 10);
  const initials = name.trim().slice(0, 2).toUpperCase();
  const palette = ["#0066CC", "#EC4899", "#10B981", "#F59E0B", "#06B6D4", "#8B5CF6"];
  const color = palette[Math.floor(Math.random() * palette.length)];
  businesses.push({ id, name: name.trim(), type: type.trim(), currency: "AED", initials, color });
  const cbId = "cb" + Math.random().toString(36).slice(2, 8);
  cashbooks.push({ id: cbId, businessId: id, name: "Main Cash", createdAt: new Date().toISOString() });
  state.activeBusinessId = id;
  state.activeCashbookId = cbId;
  closeAllDropdowns();
  renderHeader(); renderSidebar(); renderView();
  toast("Business '" + name.trim() + "' created");
}
function deleteBusinessAction() {
  if (businesses.length <= 1) { toast("Cannot delete your only business", "error"); return; }
  const biz = businesses.find(b => b.id === state.activeBusinessId);
  if (!confirm("Delete '" + (biz?.name || "this business") + "' and ALL its entries, parties, cashbooks, and team members? This CANNOT be undone.")) return;
  const id = state.activeBusinessId;
  const idx = businesses.findIndex(b => b.id === id);
  businesses.splice(idx, 1);
  // cascade delete
  for (let i = cashbooks.length - 1; i >= 0; i--) if (cashbooks[i].businessId === id) cashbooks.splice(i, 1);
  for (let i = state.parties.length - 1; i >= 0; i--) if (state.parties[i].businessId === id) state.parties.splice(i, 1);
  for (let i = state.entries.length - 1; i >= 0; i--) if (state.entries[i].businessId === id) state.entries.splice(i, 1);
  for (let i = team.length - 1; i >= 0; i--) if (team[i].businessId === id) team.splice(i, 1);
  // switch to first remaining biz
  state.activeBusinessId = businesses[0].id;
  state.activeCashbookId = cashbooks.find(c => c.businessId === state.activeBusinessId)?.id || "";
  renderView();
  toast("Business deleted — switched to " + businesses[0].name);
}
function editPartyAction(id) {
  const p = state.parties.find(x => x.id === id);
  if (!p) return;
  const name = prompt("Party name", p.name);
  if (name === null) return;
  const phone = prompt("Phone", p.phone || "");
  if (phone === null) return;
  const note = prompt("Note (optional)", p.note || "");
  state.parties = state.parties.map(x => x.id !== id ? x : {
    ...x,
    name: name.trim() || x.name,
    phone: phone.trim() || undefined,
    note: note?.trim() || undefined,
  });
  renderView();
  toast("Party updated");
}
function deletePartyAction(id) {
  const p = state.parties.find(x => x.id === id);
  if (!p) return;
  if (!confirm("Delete '" + p.name + "'? This cannot be undone.")) return;
  state.parties = state.parties.filter(x => x.id !== id);
  renderView();
  toast("Party deleted");
}

<script>
      // PWA: register service worker + capture install prompt
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('data:text/javascript,' + encodeURIComponent(
          "const CACHE='citrixa-v1';" +
          "self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['/']).catch(()=>{})))});" +
          "self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))))});" +
          "self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(caches.match(e.request).then(c=>c||fetch(e.request).then(r=>{const cl=r.clone();caches.open(CACHE).then(ca=>ca.put(e.request,cl));return r}).catch(()=>caches.match('/'))))});"
        )).then(r=>console.log('SW registered:',r.scope)).catch(e=>console.log('SW failed:',e));
      }
      window.__deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPrompt = e;
      });
      window.addEventListener('appinstalled', function() {
        window.__deferredPrompt = null;
      });
